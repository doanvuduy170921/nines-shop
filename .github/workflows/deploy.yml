name: CI/CD Enterprise Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/doanvuduy170921/nines-shop:latest
            ghcr.io/doanvuduy170921/nines-shop:sha-${{ github.sha }}

  deploy:
    needs: docker
    runs-on: self-hosted
    steps:
      - name: Checkout infra repo
        uses: actions/checkout@v4
        with:
          repository: doanvuduy170921/nineshop-infra
          token: ${{ secrets.INFRA_REPO_TOKEN }}
          path: infra

      - name: Generate production .env file securely from GitHub Secrets
        run: |
          cd "$GITHUB_WORKSPACE/infra"
          cat << 'EOF' > .env
          DB_HOST=postgres-db
          DB_PORT=5432
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_NAME=${{ secrets.DB_NAME }}
          REDIS_HOST=redis-server
          REDIS_PORT=6379
          SMTP_HOST=${{ secrets.SMTP_HOST }}
          SMTP_PORT=${{ secrets.SMTP_PORT }}
          SMTP_USER=${{ secrets.SMTP_USER }}
          SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}
          FROM_NAME=${{ secrets.FROM_NAME }}
          EOF
          chmod 600 .env

      - name: Pull latest image and deploy via Docker Compose (backend only)
        run: |
          cd "$GITHUB_WORKSPACE/infra"

          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

          docker compose -f docker-compose.prod.yml pull app
          docker compose -f docker-compose.prod.yml up -d --no-deps app

          docker image prune -f